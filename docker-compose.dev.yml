version: '3.8'

# Configuración simplificada para desarrollo local
# Uso: docker-compose -f docker-compose.dev.yml up

services:
  # Solo Backend con SQLite (más rápido para desarrollo)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: comercio_backend_dev
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=django-insecure-dev-key-123456789
      - DB_ENGINE=django.db.backends.sqlite3
      - DB_NAME=db.sqlite3
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
    networks:
      - comercio_network_dev

  # Frontend Next.js
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: comercio_frontend_dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - API_URL=http://backend:8000/api
    depends_on:
      - backend
    networks:
      - comercio_network_dev
    command: npm run dev

networks:
  comercio_network_dev:
    driver: bridge

