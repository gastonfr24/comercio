version: "3.8"

# Configuración simplificada para desarrollo local
# Uso: docker-compose -f docker-compose.dev.yml up

services:
  # Solo Backend con SQLite (más rápido para desarrollo)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: comercio_backend_dev
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env.dev
    networks:
      - comercio_network_dev

  # Frontend Next.js
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: comercio_frontend_dev
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env.development
    depends_on:
      - backend
    networks:
      - comercio_network_dev
    command: npm run dev

volumes:
  frontend_node_modules:
  frontend_next:

networks:
  comercio_network_dev:
    driver: bridge
